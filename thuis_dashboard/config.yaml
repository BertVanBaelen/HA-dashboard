name: Thuis Dashboard
version: "0.1.0"
slug: thuis_dashboard
description: Mobiel dashboard voor ons huis – tabs per onderwerp, per gebruiker instelbaar.
url: https://github.com/BertVanBaelen/HA-dashboard
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:view-dashboard
panel_title: Dashboard
homeassistant_api: true
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
