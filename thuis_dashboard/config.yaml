name: Thuis Dashboard
version: "0.3.3"
slug: thuis_dashboard
description: Mobiel dashboard voor ons huis – tabs per onderwerp, per gebruiker instelbaar.
url: https://github.com/BertVanBaelen/HA-dashboard
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:view-dashboard
panel_title: Dashboard
panel_admin: false
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
